<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — PantherIQ</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Readex+Pro:wght@400;600&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0D1117;
            color: #FFFFFF;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            padding: 24px;
        }
        .wrap { max-width: 560px; }
        .code {
            font-family: 'Space Mono', monospace;
            font-size: clamp(72px, 18vw, 140px);
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, #00F5FF 0%, #1A7CFF 50%, #8B5CF6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        h1 { font-size: 22px; margin: 18px 0 6px; }
        p.ar { font-family: 'Readex Pro', sans-serif; direction: rtl; color: #9AA1A9; margin-bottom: 28px; font-size: 16px; }
        .links { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
        a {
            display: inline-block;
            padding: 12px 26px;
            border-radius: 999px;
            text-decoration: none;
            font-size: 15px;
            color: #FFFFFF;
            border: 1px solid rgba(0, 245, 255, 0.4);
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }
        a.primary { background: linear-gradient(135deg, #00F5FF, #1A7CFF, #8B5CF6); border: none; font-weight: 600; }
        a:hover { box-shadow: 0 0 22px rgba(0, 245, 255, 0.3); border-color: rgba(0, 245, 255, 0.8); }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="code">404</div>
        <h1>This page took an unmapped route.</h1>
        <p class="ar">هذه الصفحة سلكت مساراً غير مرسوم. عد إلى الصفحة الرئيسية.</p>
        <div class="links">
            <a class="primary" href="/">English Home</a>
            <a href="/ar/">الصفحة الرئيسية بالعربية</a>
        </div>
    </div>
</body>
</html>
